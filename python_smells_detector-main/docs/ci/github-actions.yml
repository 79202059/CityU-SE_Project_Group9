# PyExamine Delta — PR 质量门禁示例工作流
#
# 用法：把这个文件复制到目标仓库的 .github/workflows/pyexamine-delta.yml。
# 它做四件事：
#   1. 在 PR 上跑增量分析（baseline 比对，只看 NEW）
#   2. 把人类可读的 Markdown 摘要写进 job summary（PR 页面上直接可看）
#   3. 生成 SARIF 并上传到 GitHub Code Scanning（公开仓库的 PR 行内提示）
#   4. 用「严重度 + 风险分 + 质量预算」三重条件决定是否阻断
#
# 需要的仓库配置：Settings → Code security → 启用 Code scanning（公开仓库免费；
# 私有仓库需要 GitHub Advanced Security，未启用时删掉 upload-sarif 那一步即可）。

name: pyexamine-delta

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 手动触发时重建基线

permissions:
  contents: read
  security-events: write # upload-sarif 需要
  pull-requests: read

env:
  # 质量预算：单个 PR 最多容忍多少个 NEW finding。超了就红。
  # 建议先设成「当前主干一半的 PR 的历史中位数」，再逐 sprint 收紧。
  PYEX_BUDGET: "20"
  # 只有风险分 >= 该值的 NEW finding 才参与阻断（0 表示不按风险筛）。
  PYEX_MIN_RISK: "40"
  # 阻断线：NEW finding 达到该严重度即失败（low / medium / high）。
  PYEX_FAIL_ON: "medium"
  # 严重度映射策略：triage 把结构性 high 降为 warning，避免结构性噪音把 PR 全打红。
  PYEX_LEVEL_POLICY: "triage"

jobs:
  smell-gate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是必须的 —— 增量分析要能解析 base 与 head 两个 commit。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 基线策略：优先用被审查分支上提交过的基线文件。
      # 基线不存在时，用 base commit 现场生成一份再比对（不让 PR 因为「没基线」而红）。
      #
      # 注意 --baseline-mode write 的语义是「给 --head 指向的那个 commit 拍快照」，
      # 所以生成主干基线要把 --head 也指到 base，否则会把 PR 自己的问题写进基线。
      - name: Resolve baseline
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          if git cat-file -e "$BASE:.pyexamine-baseline.json" 2>/dev/null; then
            git show "$BASE:.pyexamine-baseline.json" > .pyexamine-baseline.json
            echo "baseline: loaded from $BASE"
          else
            echo "::notice::no .pyexamine-baseline.json on $BASE; snapshotting that commit instead"
            pyexamine-delta . --base "$BASE" --head "$BASE" --baseline-mode write
          fi

      # 人类可读摘要：写进 job summary，PR 页面直接能看到表格。
      # 这一步失败会立刻中断，所以用 continue-on-error 保留退出码给下一步判断。
      - name: Markdown summary
        id: summary
        continue-on-error: true
        run: |
          pyexamine-delta . \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --head HEAD \
            --baseline-mode diff \
            --format markdown \
            --risk \
            --max-new "$PYEX_BUDGET" \
            | tee delta-summary.md >> "$GITHUB_STEP_SUMMARY"

      # 门禁：严重度 + 风险分 + 预算。三重条件全部在这一步里判定。
      - name: Gate
        id: gate
        continue-on-error: true
        run: |
          pyexamine-delta . \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --head HEAD \
            --baseline-mode diff \
            --format text \
            --risk \
            --min-risk "$PYEX_MIN_RISK" \
            --fail-on-new "$PYEX_FAIL_ON" \
            --max-new "$PYEX_BUDGET"

      - name: SARIF
        if: always()
        run: |
          pyexamine-delta . \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --head HEAD \
            --baseline-mode diff \
            --format sarif \
            --risk \
            --level-policy "$PYEX_LEVEL_POLICY" \
            > pyexamine.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pyexamine.sarif
          category: pyexamine-delta

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyexamine-delta
          path: |
            delta-summary.md
            pyexamine.sarif
          if-no-files-found: ignore

      # 最后统一裁决：任何一处门禁失败，整个 job 红。
      - name: Verdict
        if: steps.gate.outcome != 'success' || steps.summary.outcome != 'success'
        run: |
          echo "::error title=pyexamine-delta::新增代码异味超过门禁阈值（severity=$PYEX_FAIL_ON, min-risk=$PYEX_MIN_RISK, budget=$PYEX_BUDGET）"
          exit 1

      # 手动触发：用当前主干重建基线并提交（配合 workflow_dispatch 使用）。
      - name: Refresh baseline
        if: github.event_name == 'workflow_dispatch'
        run: |
          pyexamine-delta . --base HEAD --baseline-mode write
          echo "::notice::baseline regenerated — commit .pyexamine-baseline.json to the default branch"
